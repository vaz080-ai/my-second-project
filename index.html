<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Courses</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <header>
        <h1>Учебные курсы по IT</h1>
        <nav>
            <ul>
                <li><a href="#about">О нас</a></li>
                <li><a href="#courses">Курсы</a></li>
                <li><a href="#contact">Контакты</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="about" class="fade-in">
            <h2>О нас</h2>
            <p>Мы предоставляем качественные IT-курсы для начинающих и опытных специалистов.</p>
        </section>
        <section id="courses" class="fade-in">
            <h2>Наша программа</h2>
            <div class="course">
                <img src="course1.jpg" alt="Course 1">
                <h3>Курс 1</h3>
                <p>Описание курса 1</p>
            </div>
            <div class="course">
                <img src="course2.jpg" alt="Course 2">
                <h3>Курс 2</h3>
                <p>Описание курса 2</p>
            </div>
        </section>
        <section id="contact" class="fade-in">
            <h2>Записаться</h2>
            <button id="signup">Записаться</button>
        </section>
    </main>
    <footer>
        <p>© 2023 IT Courses</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
